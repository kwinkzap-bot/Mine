<!-- 
=======================================================
3. JAVASCRIPT INITIALIZATION
=======================================================
-->

<script>
    // Create CE Chart
    const ceChart = TradingViewChart.create({
        containerId: 'ceChartContainer',
        data: ceCandles,                    // Array of candle data
        pdh: cePdh,                         // Previous day high
        pdl: cePdl,                         // Previous day low
        currentPrice: ceCurrentPrice,       // Current closing price
        type: 'CE',                         // Chart type (CE or PE)
        timeframe: '5minute',               // Timeframe
        options: {
            height: 400,
            theme: 'light'
        }
    });

    // Create PE Chart
    const peChart = TradingViewChart.create({
        containerId: 'peChartContainer',
        data: peCandles,
        pdh: pePdh,
        pdl: pePdl,
        currentPrice: peCurrentPrice,
        type: 'PE',
        timeframe: '5minute',
        options: {
            height: 400,
            theme: 'light'
        }
    });

    // Update status badges
    const ceStatus = ceChart.getStatus();
    document.getElementById('ce-status').className = `chart-status ${ceStatus.className}`;
    document.getElementById('ce-status').textContent = ceStatus.text;

    const peStatus = peChart.getStatus();
    document.getElementById('pe-status').className = `chart-status ${peStatus.className}`;
    document.getElementById('pe-status').textContent = peStatus.text;
</script>


<!-- 
=======================================================
4. AUTO-UPDATE PATTERN (for real-time charts)
=======================================================
-->

<script>
    // Set up auto-update interval
    let updateInterval = null;

    function startAutoUpdate() {
        if (updateInterval) clearInterval(updateInterval);

        updateInterval = setInterval(async () => {
            try {
                // Fetch fresh data from your API
                const response = await fetch('/api/chart-data?symbol=NIFTY&timeframe=5minute');
                const data = await response.json();

                if (data.success) {
                    // Update both charts with new data
                    ceChart.update(data.ce_candles, data.ce_pdh, data.ce_pdl);
                    peChart.update(data.pe_candles, data.pe_pdh, data.pe_pdl);

                    // Update status badges
                    updateStatusBadges();
                }
            } catch (error) {
                console.error('Auto-update error:', error);
            }
        }, 5000); // Update every 5 seconds
    }

    function stopAutoUpdate() {
        if (updateInterval) {
            clearInterval(updateInterval);
            updateInterval = null;
        }
    }

    function updateStatusBadges() {
        const ceStatus = ceChart.getStatus();
        document.getElementById('ce-status').className = `chart-status ${ceStatus.className}`;
        document.getElementById('ce-status').textContent = ceStatus.text;

        const peStatus = peChart.getStatus();
        document.getElementById('pe-status').className = `chart-status ${peStatus.className}`;
        document.getElementById('pe-status').textContent = peStatus.text;
    }

    // Start auto-update when page loads
    startAutoUpdate();

    // Stop on page unload
    window.addEventListener('beforeunload', stopAutoUpdate);
</script>

<!-- 
=======================================================
6. RESPONSIVE RESIZE HANDLING
=======================================================
-->

<script>
    // Handle window resize
    let resizeTimeout;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
            ceChart.resize();
            peChart.resize();
            // Resize other charts as needed
        }, 250); // Debounce
    });
</script>


<!-- 
=======================================================
7. CLEANUP ON PAGE CHANGE
=======================================================
-->

<script>
    // Clean up when leaving page
    function cleanupCharts() {
        stopAutoUpdate();
        
        if (ceChart) ceChart.destroy();
        if (peChart) peChart.destroy();
        
        ceChart = null;
        peChart = null;
    }

    // Call before navigating away
    document.addEventListener('beforeunload', cleanupCharts);
</script>
