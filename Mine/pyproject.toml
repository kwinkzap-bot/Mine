[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-app"
version = "1.0.0"
description = "Live trading signal monitoring application with CPR-based entry signals"
authors = [{name = "Kavin Kumar"}]
requires-python = ">=3.9"
dependencies = [
    "flask>=2.3.0",
    "flask-session>=0.5.0",
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "requests>=2.28.0",
    "python-dotenv>=0.20.0",
    "gunicorn>=20.1.0",
    "apscheduler>=3.10.0",
    "websocket-client>=1.5.0",
    "openpyxl>=3.9.0",
    "xlrd>=2.0.1",
    "pytz>=2024.1",
    "gspread>=6.0.0",
    "google-auth>=2.28.0",
]

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
src_paths = ["src"]

[tool.pylint]
max-line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "trading_app.*"
ignore_errors = false

[tool.pylance]
extraPaths = ["src"]
pythonVersion = "3.9"
