{% extends "base.html" %}

{% block title %}Watchlist{% endblock %}

{% block head %}
{{ super() }}
<link rel="stylesheet" href="{{ url_for('static', filename='css/watchlist.css') }}?v={{ sv('css/watchlist.css') }}">
<script src="https://unpkg.com/lightweight-charts@5/dist/lightweight-charts.standalone.production.js"></script>
{% endblock %}

{% block content %}
<div class="wl-page">

  <div class="wl-topbar">
    <span class="wl-title">👁 Watchlist</span>

    <!-- Type-ahead add. Sits in the topbar rather than inside the grid so it
         is in the same place whichever tab is open, and adding to the wrong
         list is impossible — it always adds to the tab on screen. -->
    <div class="wl-search-wrap">
      <input type="search" id="wlSearch" class="wl-search" autocomplete="off"
             placeholder="Search a stock or index to add…" disabled>
      <div class="wl-suggest" id="wlSuggest" hidden></div>
    </div>

    <!-- Only shown when the open tab names one of the configured brokers;
         see brokerForTab. -->
    <button class="wl-btn" id="wlHoldings" hidden>⇩ Holdings</button>
    <button class="wl-btn" id="wlRefresh" title="Re-price every row and re-read fundamentals">
      <span class="wl-refresh-icon">↻</span> Refresh
    </button>
    <span class="wl-asof" id="wlAsOf">—</span>
    <span class="wl-dot" id="wlDot" title="Price source"></span>
  </div>

  <!-- Tab bar. The active tab carries its own rename/delete controls, so the
       chips stay readable instead of every one of them showing two icons. -->
  <div class="wl-tabbar" id="wlTabBar"></div>

  <div id="wlGrid"></div>

  <!-- Row drilldown, docked to the bottom of the viewport — the same shape
       the OI Crossover scanner uses, so the two read as one app. The table
       stays visible above it and stepping through symbols with ‹ › doesn't
       move the page under the pointer. -->
  <div class="wl-drill" id="wlDrill" hidden>
    <div class="wl-drill-hdr">
      <span class="wl-drill-sym" id="wlDrillSym"></span>
      <!-- The legend sits with the name it describes, not above the plot:
           it names this symbol's lines, so it belongs to the header rather
           than to the chart area it was stealing a row from. -->
      <div class="wl-legend" id="wlLegend"></div>
      <div class="wl-tabs" id="wlChartTabs">
        <button data-mode="price">Price</button>
        <button data-mode="pe">P/E Ratio</button>
        <button data-mode="both" class="active">Both</button>
      </div>
      <div class="wl-ranges" id="wlRanges">
        <button data-range="1m">1M</button>
        <button data-range="6m">6M</button>
        <button data-range="1y" class="active">1Y</button>
        <button data-range="3y">3Y</button>
        <button data-range="5y">5Y</button>
      </div>
      <!-- Stepping through symbols lives at the right end, next to Close:
           the controls that change WHICH symbol and whether it stays open
           are one cluster, away from the ones that change the view. -->
      <div class="wl-drill-nav">
        <button id="wlPrev" title="Previous symbol (←)">‹</button>
        <button id="wlNext" title="Next symbol (→)">›</button>
      </div>
      <button class="wl-drill-close" id="wlDrillClose" title="Close (Esc)">✕</button>
    </div>
    <div class="wl-drill-body" id="wlDrillBody"></div>
  </div>

  <!-- Candlestick chart, opened from the symbol link.
       Drawn here rather than embedded from TradingView: their widget will
       not serve NSE data to an anonymous embed — every Indian symbol comes
       back "This symbol is only available on TradingView" (checked on both
       the widgetembed endpoint and the tv.js Advanced Chart widget, with
       and without a sandbox and a referrer). The link out still opens the
       real thing on their site, where the viewer's own session applies. -->
  <div class="wl-tv-back" id="wlTvBack" hidden>
    <div class="wl-tv" role="dialog" aria-modal="true" aria-labelledby="wlTvTitle">
      <div class="wl-tv-hdr">
        <span class="wl-drill-sym" id="wlTvTitle"></span>
        <!-- Timeframe. The CPR period follows from it rather than being
             picked separately — one step up, always. -->
        <select class="wl-tf" id="wlTvInterval" title="Chart timeframe">
          <option value="1m">1m</option>
          <option value="5m">5m</option>
          <option value="15m">15m</option>
          <option value="30m">30m</option>
          <option value="1h">1h</option>
          <option value="1d" selected>1D</option>
          <option value="1wk">1W</option>
          <option value="1mo">1M</option>
        </select>
        <button class="wl-cpr-toggle active" id="wlTvCpr"
                title="Central Pivot Range (TC/P/BC) with Camarilla R3 and S3, from the previous period">
          CPR <span id="wlTvCprPeriod">Monthly</span>
        </button>
        <a class="wl-tv-out" id="wlTvOut" target="_blank" rel="noopener noreferrer"
           title="Open this chart on tradingview.com">Open on TradingView ↗</a>
        <div class="wl-drill-nav">
          <button id="wlTvPrev" title="Previous symbol (←)">‹</button>
          <button id="wlTvNext" title="Next symbol (→)">›</button>
        </div>
        <button class="wl-drill-close" id="wlTvClose" title="Close (Esc)">✕</button>
      </div>
      <!-- Two panes, because the question "is this a buy" is asked at two
           timeframes at once: the top one follows the dropdown, the bottom
           is pinned to weekly so the higher-timeframe structure is always
           on screen next to whatever is being examined above it. -->
      <div class="wl-tv-panes">
        <div class="wl-tv-pane">
          <span class="wl-tv-cap" id="wlTvCapTop">1D</span>
          <div class="wl-tv-body" id="wlTvBody"></div>
        </div>
        <div class="wl-tv-pane">
          <span class="wl-tv-cap" id="wlTvCapBottom">1W</span>
          <div class="wl-tv-body" id="wlTvBodyWeekly"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Order ticket. Nothing on this page reaches a broker without passing
       through here: the grid's B/S buttons only ever open it, and the confirm
       button is the single place that POSTs. Same shape as the OI Crossover
       scanner's ticket, so an order looks the same wherever it is placed. -->
  <div class="wl-ticket-back" id="wlTicketBack" hidden>
    <div class="wl-ticket" role="dialog" aria-modal="true" aria-labelledby="wlTicketTitle">
      <div class="wl-ticket-hdr">
        <span id="wlTicketTitle">Place order</span>
        <button class="wl-ticket-close" id="wlTicketClose" title="Cancel (Esc)">✕</button>
      </div>
      <div class="wl-ticket-body" id="wlTicketBody"></div>
      <div class="wl-ticket-foot">
        <span class="wl-ticket-msg" id="wlTicketMsg"></span>
        <button class="wl-btn" id="wlTicketCancel">Cancel</button>
        <button class="wl-btn wl-btn-primary" id="wlTicketSend">Place order</button>
      </div>
    </div>
  </div>

  <!-- One dialog for both "New tab" and "Rename tab": the same single field
       and the same validation, so they cannot drift apart. -->
  <div class="wl-modal-back" id="wlModalBack" hidden>
    <div class="wl-modal" role="dialog" aria-modal="true" aria-labelledby="wlModalTitle">
      <div class="wl-modal-hdr">
        <span id="wlModalTitle">New tab</span>
        <button class="wl-modal-close" id="wlModalClose" title="Cancel (Esc)">✕</button>
      </div>
      <div class="wl-modal-body">
        <input type="text" id="wlModalInput" class="wl-modal-input" maxlength="40"
               placeholder="e.g. Core holdings" autocomplete="off">
        <!-- Says which account the tab IS, rather than leaving it to be
             inferred from the name — "Saran" cannot pick between
             Saranya (Kite) and Saranya (Dhan). A bound tab follows that
             account's positions and cannot be deleted. -->
        <label class="wl-modal-label" for="wlModalBroker">Follows account</label>
        <select id="wlModalBroker" class="wl-modal-input"></select>
        <p class="wl-modal-msg" id="wlModalMsg"></p>
      </div>
      <div class="wl-modal-foot">
        <button class="wl-btn" id="wlModalCancel">Cancel</button>
        <button class="wl-btn wl-btn-primary" id="wlModalSave">Save</button>
      </div>
    </div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/watchlist.js') }}?v={{ sv('js/watchlist.js') }}"></script>
<script>watchlistInit();</script>
{% endblock %}
