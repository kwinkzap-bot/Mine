<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='trading.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/notifications.css') }}">
    <title>{% block title %}Stock Scanner{% endblock %}</title>
    {% block head %}{% endblock %}
</head>
<body>
    <div id="notification-container"></div>
    <div class="container">
        <div class="navigation-bar">
            <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">🏠 Home</a>
            <a href="/historical" class="nav-link {% if request.path == '/historical' %}active{% endif %}">📈 Historical</a>
            <a href="/strategy" class="nav-link {% if request.path == '/strategy' %}active{% endif %}">📊 Strategy</a>
            <a href="/cpr-filter" class="nav-link {% if request.path == '/cpr-filter' %}active{% endif %}">🔍 CPR Filter</a>
            <a href="/options-chart" class="nav-link {% if request.path == '/options-chart' %}active{% endif %}">📉 Options Chart</a>
            <a href="/multi-strike" class="nav-link {% if request.path == '/multi-strike' %}active{% endif %}">⚡ Multi Strike</a>
            <a href="/intraday-option" class="nav-link {% if request.path == '/intraday-option' %}active{% endif %}">💹 Intraday Option</a>
            <a href="/auth/login" class="nav-link-login">🔑 Login to Zerodha</a>
        </div>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
    <!-- Constants must be loaded first -->
    <script src="{{ url_for('static', filename='js/constants.js') }}"></script>
    <script src="{{ url_for('static', filename='js/notifications.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/cpr_filter_scheduler.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
