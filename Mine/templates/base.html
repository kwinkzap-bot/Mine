<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='trading.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/notifications.css') }}">
    <title>{% block title %}Stock Scanner{% endblock %}</title>
    {% block head %}{% endblock %}
</head>
<body>
    <div id="notification-container"></div>
    <div class="container">
        <div class="navigation-bar">
            <a href="/historical" class="nav-link {% if request.path == '/historical' %}active{% endif %}">📈 Historical</a>
            <a href="/strategy" class="nav-link {% if request.path == '/strategy' %}active{% endif %}">📊 Strategy</a>
            <a href="/multi-strike" class="nav-link {% if request.path == '/multi-strike' %}active{% endif %}">⚡ Multi Strike</a>
            <a href="/cpr-filter" class="nav-link {% if request.path == '/cpr-filter' %}active{% endif %}">🔍 CPR Filter</a>
            <a href="/options-chart" class="nav-link {% if request.path == '/options-chart' %}active{% endif %}">📉 Options Chart</a>
            <a href="/intraday-option" class="nav-link {% if request.path == '/intraday-option' %}active{% endif %}">💹 Intraday Option</a>
            <a href="/intraday-920" class="nav-link {% if request.path == '/intraday-920' %}active{% endif %}">⏰ Intraday 9:20</a>
            <div class="login-dropdown">
                <button class="nav-link-login" id="loginToggle">🔑</button>
                <div class="dropdown-menu" id="dropdownMenu">
                    <a href="/auth/login" class="dropdown-item">Login to Zerodha</a>
                    <a href="#" class="dropdown-item" onclick="event.preventDefault(); showDhanLoginModal();">Login to Dhan</a>
                    <a href="#" class="dropdown-item" onclick="event.preventDefault(); showFyersLoginModal();">Login to Fyers</a>
                    <a href="#" class="dropdown-item" onclick="event.preventDefault(); showKotakLoginModal();">Login to Kotak Neo</a>
                </div>
            </div>
        </div>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
    <!-- Constants must be loaded first -->
    <script src="{{ url_for('static', filename='js/constants.js') }}"></script>
    <script src="{{ url_for('static', filename='js/notifications.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/cpr_filter_scheduler.js') }}"></script>
    <script>
        // Login dropdown toggle
        document.getElementById('loginToggle').addEventListener('click', function(e) {
            e.preventDefault();
            const dropdownMenu = document.getElementById('dropdownMenu');
            dropdownMenu.classList.toggle('show');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            const dropdown = document.querySelector('.login-dropdown');
            if (!dropdown.contains(e.target)) {
                document.getElementById('dropdownMenu').classList.remove('show');
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
