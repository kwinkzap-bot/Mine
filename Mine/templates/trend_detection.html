{% extends "base.html" %}

{% block title %}Trend{% endblock %}

{% block head %}
{{ super() }}
<link rel="stylesheet" href="{{ url_for('static', filename='css/active_contracts.css') }}?v={{ sv('css/active_contracts.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}?v={{ sv('css/dashboard.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/trend_detection.css') }}?v={{ sv('css/trend_detection.css') }}">
{% endblock %}

{% block content %}
<div class="td-page" id="tdPage">

    <!-- Controls -->
    <div class="td-controls">
        <div class="td-ctrl-title">
            📈 Trend Detection
        </div>
        <div class="td-ctrl-inputs">
            <div class="td-ctrl-group">
                <select id="tdSymbol" class="td-select">
                    <option value="NIFTY" selected>NIFTY</option>
                    <option value="BANKNIFTY">BANKNIFTY</option>
                    <option value="FINNIFTY">FINNIFTY</option>
                    <option value="MIDCPNIFTY">MIDCPNIFTY</option>
                    <option value="SENSEX">SENSEX</option>
                    <option value="NIFTYNXT50">NIFTYNXT50</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Next Session Outlook (same 5-year NIFTY model as the Historic OI route) -->
    <div class="td-card" style="margin-bottom:10px;">
        <div class="td-card-hdr">
            <h2>Next Session Outlook</h2>
            <div class="td-card-hdr-meta">NIFTY · 5-yr model</div>
        </div>
        <div class="sw-wrap" style="padding:0;">
            <div id="tdHoiPredict" class="ac-analysis" style="border:1px solid var(--pf-border);border-radius:8px;background:var(--pf-surface)">
                <span style="font-size:11px;color:var(--pf-text-3)">Running 5-year analysis…</span>
            </div>
        </div>
    </div>

    <!-- Market Direction (mirrors the Contracts route's analysis block) -->
    <div class="td-card" style="margin-bottom:10px;">
        <div class="td-card-hdr">
            <h2>Market Direction</h2>
            <div class="td-card-hdr-meta" id="tdMdMeta"></div>
        </div>
        <div class="ac-page">
            <div class="ac-analysis hidden" id="tdMarketDirection"></div>
        </div>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/trend_detection.js') }}"></script>
<script>
    (function () {
        const page = document.getElementById('tdPage');

        // Sync to the already-active theme on load (no dispatch needed — it
        // isn't changing).
        window.AppTheme.syncTheme(window.AppTheme.getActiveTheme(), [page]);

        window.addEventListener('themechanged', e => {
            window.AppTheme.applyThemeClass(page, e.detail.theme);
        });
    })();
</script>
{% endblock %}
