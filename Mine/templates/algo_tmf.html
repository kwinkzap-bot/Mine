    <!-- ════════════════════════════════════════════════════════ -->
    <!-- 30-Min Opening Fakeout panel (LIVE — real Intraday orders) -->
    <!-- Own files: algo_tmf.html (this) + static/js/algo_tmf.js.  -->
    <!-- ════════════════════════════════════════════════════════ -->
    <div class="ag-panel" id="algo-tmf-panel">

    <!-- ── Header ──────────────────────────────────────────────── -->
    <div class="ag-header">
        <span class="ag-title">30-Min Opening Fakeout</span>
        <button class="ag-info-btn" id="tmfLogicBtn" onclick="tmfShowLogic()"
                title="View strategy logic, entry &amp; exit rules" aria-label="Strategy logic">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            <span>Logic</span>
        </button>
        <span id="tmfModeBadge" class="dg-badge dg-badge--warn">SCAN ONLY</span>
        <span id="tmfRunBadge" class="ag-badge inactive">
            <span class="ag-badge-dot"></span>
            <span id="tmfRunBadgeText">Stopped</span>
        </span>
        <button class="ag-btn ag-btn-strikes" id="tmfStartBtn" onclick="_tmfStart()">▶ Start</button>
        <button class="ag-btn ag-btn-strikes" id="tmfStopBtn" onclick="_tmfStop()">■ Stop</button>
        <span class="ag-last-upd" id="tmfLastUpd" style="margin-left:auto"></span>
    </div>

    <!-- ── Today's summary ─────────────────────────────────────── -->
    <div class="ag-card">
        <div class="ag-card-hdr">
            <span class="ag-card-title">Today's Summary</span>
            <span class="ag-card-hdr-actions" style="margin-left:auto">
                <button class="ag-btn ag-btn-strikes" id="tmfRefreshBtn" onclick="_tmfFetchStatus()">↻ Refresh</button>
            </span>
        </div>
        <div class="ag-card-body">
            <div class="ag-grid" id="tmfSummaryGrid">
                <div class="ag-empty">Waiting for today's scan…</div>
            </div>
        </div>
    </div>

    <!-- ── Per-stock status ─────────────────────────────────────── -->
    <div class="ag-card">
        <div class="ag-card-hdr">
            <span class="ag-card-title">Stock Status</span>
            <label style="margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ag-text-3);font-weight:600">
                <input type="checkbox" id="tmfShowAllStocks" onchange="_tmfRenderStocks()">
                Show all 143 stocks (incl. no-setup / not yet scanned)
            </label>
        </div>
        <div id="tmfStocksBody">
            <div class="ag-empty">No data yet</div>
        </div>
    </div>

    <!-- ── Equity Curve ─────────────────────────────────────────── -->
    <div id="tmfEquityCurveSection" class="equity-curve-container" style="display:none;">
        <div class="equity-curve-header" data-collapse=".tmf-equity-chart-wrap">
            <h3>Equity Curve</h3>
            <div class="equity-curve-meta">
                <span class="equity-meta-item" id="tmfEquityCurveFinalPnl" style="font-weight:700;"></span>
            </div>
        </div>
        <div class="equity-chart-wrap tmf-equity-chart-wrap">
            <canvas id="tmfEquityCurveChart" role="img" aria-label="Equity curve: portfolio value after each live trade"></canvas>
        </div>
    </div>

    <!-- ── P&L Breakdown ────────────────────────────────────────── -->
    <div id="tmfPeriodBreakdownSection" class="period-breakdown" style="display:none;">
        <div class="period-breakdown-header" data-collapse=".tmf-period-chart-wrap">
            <h3>P&amp;L Breakdown</h3>
            <div class="period-tabs" id="tmfPeriodTabs">
                <button class="period-tab active" data-period="monthly">Monthly</button>
                <button class="period-tab" data-period="weekly">Weekly</button>
                <button class="period-tab" data-period="daily">Daily</button>
                <button class="period-tab" data-period="quarterly">3 Months</button>
                <button class="period-tab" data-period="halfyearly">6 Months</button>
                <button class="period-tab" data-period="yearly">Yearly</button>
            </div>
        </div>
        <div class="period-chart-wrap tmf-period-chart-wrap">
            <div class="period-chart-inner" id="tmfPeriodChartInner">
                <canvas id="tmfPeriodBreakdownChart"></canvas>
            </div>
        </div>
    </div>

    <!-- ── Trade History Summary (everything below is net of charges) ── -->
    <div class="ag-card" id="tmfPerfCard" style="display:none">
        <div class="ag-card-hdr">
            <span class="ag-card-title">Trade History Summary</span>
            <span id="tmfPerfMeta" style="margin-left:auto;font-size:11px;color:var(--ag-text-3)"></span>
            <span id="tmfPerfNet" style="font-size:12px;font-weight:800"></span>
        </div>
        <div class="ag-card-body">
            <div class="ag-grid" id="tmfPerfStats"></div>
        </div>
    </div>

    <!-- ── Executed Trade History ──────────────────────────────── -->
    <div class="ag-card">
        <div class="ag-card-hdr">
            <span class="ag-card-title">Executed Trade History</span>
            <span style="margin-left:auto;font-size:11px;color:var(--ag-text-3)"
                  title="Brokerage (₹20/order cap), STT, exchange transaction charges, GST, stamp duty and SEBI fees are computed per trade off its own turnover and deducted from the P&amp;L shown">
                P&amp;L is net of Zerodha intraday charges
            </span>
            <span id="tmfHistCount" style="font-size:11px;color:var(--ag-text-3)"></span>
            <button class="ag-hist-delall-btn" onclick="_tmfDeleteAllTrades()" title="Delete ALL trade history records">&#128465; Delete All</button>
        </div>
        <div id="tmfHistBody">
            <div class="ag-empty">No completed trades</div>
        </div>
    </div>

    </div><!-- #algo-tmf-panel -->
