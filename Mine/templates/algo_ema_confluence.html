    <!-- EMA Confluence Breakout panel (PAPER TRADE — futures)    -->
    <!-- Own files: algo_ema_confluence.html (this) + static/js/algo_ema_confluence.js. -->
    <!-- ════════════════════════════════════════════════════════ -->
    <div class="ag-panel" id="algo-ema-confluence-panel">

    <!-- ── Header ──────────────────────────────────────────────── -->
    <div class="ag-header">
        <span class="ag-title">EMA Confluence Breakout</span>
        <button class="ag-info-btn" id="emacLogicBtn" onclick="emacShowLogic()"
                title="View strategy logic, entry &amp; exit rules" aria-label="Strategy logic">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            <span>Logic</span>
        </button>
        <span class="dg-badge dg-badge--warn">PAPER TRADE · FUTURES</span>
        <span id="emacRunBadge" class="ag-badge inactive">
            <span class="ag-badge-dot"></span>
            <span id="emacRunBadgeText">Stopped</span>
        </span>
        <button class="ag-btn ag-btn-strikes" id="emacStartBtn" onclick="_emacStart()">▶ Start</button>
        <button class="ag-btn ag-btn-strikes" id="emacStopBtn" onclick="_emacStop()">■ Stop</button>
        <span class="ag-last-upd" id="emacLastUpd" style="margin-left:auto"></span>
    </div>

    <!-- ── Today's summary ─────────────────────────────────────── -->
    <div class="ag-card">
        <div class="ag-card-hdr">
            <span class="ag-card-title">Today's Summary</span>
            <span class="ag-card-hdr-actions" style="margin-left:auto">
                <button class="ag-btn ag-btn-strikes" id="emacRefreshBtn" onclick="_emacFetchStatus()">↻ Refresh</button>
            </span>
        </div>
        <div class="ag-card-body">
            <div class="ag-grid" id="emacSummaryGrid">
                <div class="ag-empty">Waiting for today's scan…</div>
            </div>
        </div>
    </div>

    <!-- ── Per-symbol status ─────────────────────────────────────── -->
    <div class="ag-card">
        <div class="ag-card-hdr">
            <span class="ag-card-title">Symbol Status</span>
            <label style="margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ag-text-3);font-weight:600">
                <input type="checkbox" id="emacShowAllStocks" onchange="_emacRenderStocks()">
                Show all <span id="emacUniverseCount">—</span> symbols (incl. no-setup / not yet scanned)
            </label>
        </div>
        <div id="emacStocksBody">
            <div class="ag-empty">No data yet</div>
        </div>
    </div>

    <!-- ── Equity Curve ─────────────────────────────────────────── -->
    <div id="emacEquityCurveSection" class="equity-curve-container" style="display:none;">
        <div class="equity-curve-header" data-collapse=".emac-equity-chart-wrap">
            <h3>Equity Curve</h3>
            <div class="equity-curve-meta">
                <span class="equity-meta-item" id="emacEquityCurveFinalPnl" style="font-weight:700;"></span>
            </div>
        </div>
        <div class="equity-chart-wrap emac-equity-chart-wrap">
            <canvas id="emacEquityCurveChart" role="img" aria-label="Equity curve: portfolio value after each paper trade"></canvas>
        </div>
    </div>

    <!-- ── P&L Breakdown ────────────────────────────────────────── -->
    <div id="emacPeriodBreakdownSection" class="period-breakdown" style="display:none;">
        <div class="period-breakdown-header" data-collapse=".emac-period-chart-wrap">
            <h3>P&amp;L Breakdown</h3>
            <div class="period-tabs" id="emacPeriodTabs">
                <button class="period-tab active" data-period="monthly">Monthly</button>
                <button class="period-tab" data-period="weekly">Weekly</button>
                <button class="period-tab" data-period="daily">Daily</button>
                <button class="period-tab" data-period="quarterly">3 Months</button>
                <button class="period-tab" data-period="halfyearly">6 Months</button>
                <button class="period-tab" data-period="yearly">Yearly</button>
            </div>
        </div>
        <div class="period-chart-wrap emac-period-chart-wrap">
            <div class="period-chart-inner" id="emacPeriodChartInner">
                <canvas id="emacPeriodBreakdownChart"></canvas>
            </div>
        </div>
    </div>

    <!-- ── Trade History Summary (net of charges) ───────────────── -->
    <div class="ag-card" id="emacPerfCard" style="display:none">
        <div class="ag-card-hdr">
            <span class="ag-card-title">Trade History Summary</span>
            <span id="emacPerfMeta" style="margin-left:auto;font-size:11px;color:var(--ag-text-3)"></span>
            <span id="emacPerfNet" style="font-size:12px;font-weight:800"></span>
        </div>
        <div class="ag-card-body">
            <div class="ag-grid" id="emacPerfStats"></div>
        </div>
    </div>

    <!-- ── Executed Trade History ──────────────────────────────── -->
    <div class="ag-card">
        <div class="ag-card-hdr">
            <span class="ag-card-title">Executed Trade History (Paper)</span>
            <span style="margin-left:auto;font-size:11px;color:var(--ag-text-3)">P&amp;L is net of Zerodha futures charges</span>
            <span id="emacHistCount" style="font-size:11px;color:var(--ag-text-3)"></span>
            <button class="ag-hist-delall-btn" onclick="_emacDeleteAllTrades()" title="Delete ALL trade history records">&#128465; Delete All</button>
        </div>
        <div id="emacHistBody">
            <div class="ag-empty">No completed trades</div>
        </div>
    </div>

    </div><!-- #algo-ema-confluence-panel -->
