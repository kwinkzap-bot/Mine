    <!-- ════════════════════════════════════════════════════════ -->
    <!-- ST + BB + RSI panel — the Backtest page's strategy run    -->
    <!-- live on {{ symbol }} options. One template, three tabs (algo_stbb.html + -->
    <!-- static/js/algo_stbb.js; the thread is algo/st_bb_rsi/.    -->
    <!-- ════════════════════════════════════════════════════════ -->
    <div class="ag-panel" id="algo-{{ key }}-panel">

    <div class="ag-subtabs">
        <button class="ag-subtab{% if key == 'stbb' %} active{% endif %}" onclick="algoSwitch('stbb')">NIFTY</button>
        <button class="ag-subtab{% if key == 'stbb-bn' %} active{% endif %}" onclick="algoSwitch('stbb-bn')">BANKNIFTY</button>
        <button class="ag-subtab{% if key == 'stbb-sx' %} active{% endif %}" onclick="algoSwitch('stbb-sx')">SENSEX</button>
    </div>

    <div class="ag-header">
        <span class="ag-title">ST + BB + RSI · {{ symbol }}</span>
        <span id="{{ p }}ModeBadge" class="dg-badge dg-badge--warn">PAPER</span>
        <!-- {{ pfx }}_MODE, read at every entry: Paper records the option leg at its real
             premium and sends nothing; Live buys it at every account with
             BROKER_N_{{ pfx }}_ACTIVE=true (zerodha / fyers). -->
        <div class="rtp-period-tabs" id="{{ p }}ModeToggle" style="margin-left:0"
             title="Paper: every entry and exit is recorded at the option's real premium — nothing is sent. Live: the option is bought at every account with BROKER_N_{{ pfx }}_ACTIVE=true. Applies from the next entry; an open position keeps its mode.">
            <button class="rtp-period-tab" data-mode="paper" onclick="_stbbSetMode('{{ key }}', 'paper')">Paper</button>
            <button class="rtp-period-tab" data-mode="live"  onclick="_stbbSetMode('{{ key }}', 'live')">Live</button>
        </div>
        <span id="{{ p }}RunBadge" class="ag-badge inactive">
            <span class="ag-badge-dot"></span>
            <span id="{{ p }}RunBadgeText">Stopped</span>
        </span>
        <button class="ag-btn ag-btn-strikes" onclick="_stbbStart('{{ key }}')">▶ Start</button>
        <button class="ag-btn ag-btn-strikes" onclick="_stbbStop('{{ key }}')">■ Stop</button>
        <a class="ag-btn ag-btn-strikes" href="/backtest" title="The rule's backtest (ST + BB + RSI + R1)">Backtest ↗</a>
        <span class="ag-last-upd" id="{{ p }}LastUpd" style="margin-left:auto"></span>
    </div>

    <!-- ── Rule + sizing ───────────────────────────────────────── -->
    <div class="ag-card">
        <div class="ag-card-hdr">
            <span class="ag-card-title">Rule &amp; Accounts</span>
            <label class="cpr-num" title="Long buys a CALL; Short buys a PUT; Both takes whichever fires first.">Side
                <select id="{{ p }}Direction" onchange="_stbbSave('{{ key }}', {direction:this.value})">
                    <option value="both">Both</option><option value="long">Long (CE)</option><option value="short">Short (PE)</option>
                </select></label>
            <label class="cpr-num" title="Trades a day, one open at a time">Max trades
                <input type="number" id="{{ p }}MaxTrades" min="1" max="10" step="1" onchange="_stbbSave('{{ key }}', {max_trades:+this.value})"></label>
            <label class="cpr-num" title="The strike whose premium is nearest this is bought">Premium ≈
                <input type="number" id="{{ p }}Premium" class="cpr-num-wide" min="20" max="5000" step="10" onchange="_stbbSave('{{ key }}', {premium:+this.value})"></label>
        </div>
        <div class="ag-card-body">
            <div id="{{ p }}Sizing" style="margin-bottom:8px;font-size:11px;color:var(--ag-text-3)"></div><div class="ag-grid" id="{{ p }}Accounts"><div class="ag-empty">…</div></div>
            <div id="{{ p }}Rule" style="margin-top:8px;font-size:11px;color:var(--ag-text-3)"></div></div>
    </div>

    <!-- ── Today ───────────────────────────────────────────────── -->
    <div class="ag-card">
        <div class="ag-card-hdr">
            <span class="ag-card-title">Today</span>
            <span id="{{ p }}Spot" style="margin-left:12px;font-size:11px;color:var(--ag-text-3)"></span>
            <span class="ag-card-hdr-actions" style="margin-left:auto">
                <button class="ag-btn ag-btn-strikes" onclick="_stbbFetchStatus('{{ key }}')">↻ Refresh</button>
            </span>
        </div>
        <div class="ag-card-body">
            <div id="{{ p }}Trades"><div class="ag-empty">No signal yet today</div></div>
            <div class="cpr-log" id="{{ p }}Log"></div>
        </div>
    </div>

    <!-- ── History ─────────────────────────────────────────────── -->
    <div class="ag-card">
        <div class="ag-card-hdr">
            <span class="ag-card-title">Trade History</span>
            <div class="rtp-period-tabs" id="{{ p }}BookTabs" style="margin-left:12px">
                <button class="rtp-period-tab active" data-book="all"   onclick="_stbbSetBook('{{ key }}', 'all')">All</button>
                <button class="rtp-period-tab"        data-book="paper" onclick="_stbbSetBook('{{ key }}', 'paper')">Paper</button>
                <button class="rtp-period-tab"        data-book="live"  onclick="_stbbSetBook('{{ key }}', 'live')">Live</button>
            </div>
            <span id="{{ p }}HistSummary" style="margin-left:auto;font-size:11px;font-weight:700"></span>
        </div>
        <div id="{{ p }}HistBody"><div class="ag-empty">No completed trades</div></div>
    </div>

    </div><!-- #algo-stbb-panel -->
