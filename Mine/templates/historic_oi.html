{% extends "base.html" %}
{% block title %}Historic OI{% endblock %}
{% block head %}
{{ super() }}
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}?v={{ sv('css/dashboard.css') }}">
{% endblock %}
{% block content %}
  <div class="sw-wrap hoi-page">

    <!-- Topbar: two primary actions -->
    <div class="sw-topbar">
      <span class="sw-title">Historic OI (NIFTY)</span>
      <span class="sw-updated" style="margin-left:12px;color:var(--pf-text-3);font-size:11px">⏱ Auto-records daily at 8:00 PM IST</span>
      <span id="hoiStatus" class="sw-updated" style="margin-left:auto;margin-right:8px;"></span>
      <button class="sw-refresh-btn" style="margin-right:6px;opacity:.85" onclick="hoiToggleHistorical()">🗓 Historical Update</button>
      <button id="hoiFetchLatestBtn" class="sw-refresh-btn" onclick="hoiFetchLatest()">⟳ Fetch Latest</button>
    </div>
    <!-- Historical Update panel — backfill a date range from NSE bhavcopy (hidden by default) -->
    <div id="hoiHistoricalPanel" style="display:none;padding:10px 14px;background:var(--pf-row-alt);border-bottom:1px solid var(--pf-border);gap:10px;flex-wrap:wrap;align-items:center">
      <label style="font-size:12px;color:var(--pf-text-2);font-weight:600">From</label>
      <div class="hoi-date-wrap"><input type="date" id="hoiFromDate" value="2021-01-01"></div>
      <label style="font-size:12px;color:var(--pf-text-2);font-weight:600">To</label>
      <div class="hoi-date-wrap"><input type="date" id="hoiToDate"></div>
      <button class="sw-refresh-btn" onclick="hoiHistoricalUpdate()" id="hoiUpdateBtn">▶ Update Range</button>
      <span id="hoiLoadMsg" style="font-size:11px;color:var(--pf-text-2)"></span>
    </div>
    <!-- Backfill progress bar -->
    <div id="hoiProgressWrap" style="display:none;padding:6px 14px;background:var(--pf-row-alt);border-bottom:1px solid var(--pf-border)">
      <div style="display:flex;align-items:center;gap:10px">
        <span id="hoiProgressMsg" style="font-size:11px;color:var(--pf-text-2);flex:1">Loading…</span>
        <span id="hoiProgressPct" style="font-size:11px;color:var(--pf-text-3)">0%</span>
      </div>
      <div style="height:4px;background:var(--pf-border);border-radius:2px;margin-top:4px">
        <div id="hoiProgressFill" style="height:100%;width:0%;background:var(--pf-accent);border-radius:2px;transition:width .3s"></div>
      </div>
    </div>

    <!-- Next-session prediction (5-year statistical analysis) -->
    <div id="hoiPredict" class="ac-analysis" style="margin-bottom:10px;padding:12px 14px;border:1px solid var(--pf-border);border-radius:8px;background:var(--pf-surface)">
      <span style="font-size:11px;color:var(--pf-text-3)">Running 5-year analysis…</span>
    </div>

    <!-- NIFTY grid — shared grid (DataGrid, rendered by _hoiRenderAll in
         static/js/historic_oi.js) -->
    <div class="sw-table-wrap" id="hoi-panel-NIFTY">
      <div id="hoiGrid-NIFTY">
        <div class="dg-empty">Loading…</div>
      </div>
    </div>

  </div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/historic_oi.js') }}?v={{ sv('js/historic_oi.js') }}"></script>
{% endblock %}
